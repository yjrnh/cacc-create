name: 流量归档 / Archive Traffic

# 每周一 08:00（北京时间）自动抓取 GitHub Traffic 数据并存档
# GitHub 只保留最近 14 天的每日浏览/克隆数据，本工作流把它沉淀成永久 CSV
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支（脚本来自这里）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 复制脚本到临时目录
        run: cp scripts/archive_traffic.py /tmp/archive_traffic.py

      - name: 切换到存档分支 traffic-archive
        run: |
          set -e
          git config user.name "traffic-archive-bot"
          git config user.email "traffic-archive-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin traffic-archive > /dev/null 2>&1; then
            echo "分支已存在，检出"
            git fetch origin traffic-archive
            git checkout -B traffic-archive origin/traffic-archive
          else
            echo "首次运行，创建孤立分支"
            git checkout --orphan traffic-archive
            git rm -rf --quiet . || true
            git commit --allow-empty -m "chore: init traffic archive"
          fi

      - name: 抓取并合并流量数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 /tmp/archive_traffic.py

      - name: 提交存档
        run: |
          set -e
          git add metrics
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore: traffic snapshot $(date -u +%F)"
            git push origin traffic-archive
          fi
